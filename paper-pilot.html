<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<script>tailwind.config={theme:{extend:{colors:{deep:'#162140',matte:'#31507A',sky:'#9ACCE5',gold:'#FFD400',charcoal:'#525F7A',blast:'#FF4FA3',shield:'#8CF5B0',slow:'#D3DAE4'},fontFamily:{display:['Nordt','"Krona One"','sans-serif'],body:['"DM Sans"','system-ui','sans-serif']}}}}</script>
<style>

<main id="stage" class="stage relative h-full w-full overflow-hidden select-none font-body text-white">

<header class="pointer-events-none absolute inset-x-0 top-0 flex items-start justify-between p-6 sm:p-10">

<ul id="lives" class="flex gap-2 sm:gap-3" aria-label="Lives">
<li class="text-gold transition-colors duration-300"><svg class="h-6 w-8 sm:h-8 sm:w-11" viewBox="0 0 44 32" fill="currentColor"><polygon points="0,10 10,0 22,12 34,0 44,10 22,32"/></svg></li>
<li class="text-gold transition-colors duration-300"><svg class="h-6 w-8 sm:h-8 sm:w-11" viewBox="0 0 44 32" fill="currentColor"><polygon points="0,10 10,0 22,12 34,0 44,10 22,32"/></svg></li>
<li class="text-gold transition-colors duration-300"><svg class="h-6 w-8 sm:h-8 sm:w-11" viewBox="0 0 44 32" fill="currentColor"><polygon points="0,10 10,0 22,12 34,0 44,10 22,32"/></svg></li>

</footer>

</div>
</form>
<div class="absolute bottom-6 right-6 flex gap-2 sm:bottom-10 sm:right-10">

</div>
</main>
<script>
const stage=document.getElementById('stage'),cv=document.getElementById('sky'),cx=cv.getContext('2d');
const ui={level:document.getElementById('level'),timer:document.getElementById('timer'),lives:[...document.querySelectorAll('#lives li')],panel:document.getElementById('panel'),title:document.getElementById('panelTitle'),text:document.getElementById('panelText'),btn:document.getElementById('startBtn'),tune:document.getElementById('tune'),tuneBtn:document.getElementById('tuneBtn'),sliders:document.getElementById('sliders'),god:document.getElementById('t-god'),reset:document.getElementById('tuneReset'),now:document.getElementById('o-now'),fs:document.getElementById('fsBtn'),reel:document.getElementById('reel'),wheel:document.getElementById('wheel')};
const LEVEL_TIME=30,DEF={plane:1,bars:1,course:1,speed:1,accel:1,inertia:1,god:true};
const SPEC=[['plane','Plane size'],['bars','Obstacle size'],['course','Course scale'],['speed','Speed'],['accel','Acceleration'],['inertia','Inertia']];
let cfg={...DEF};try{Object.assign(cfg,JSON.parse(localStorage.getItem('pp-tune2')||'{}'))}catch(e){}
const eff=(k,f=.05)=>Math.max(cfg[k],f);
const P={x:0,y:0,vx:0,vy:0,tx:0,ty:0,a:0,lift:0,L:120};
let W=0,H=0,BW=20,bars=[],nextX=0,prev='bottom',state='ready',level=1,lives=3,left=LEVEL_TIME,flown=0,inv=0,boost=1,last=performance.now(),orbs=[],shots=[],fx=[],sel=0,spinning=false,slowT=0,shieldT=0,stock={blast:0},owned=[],sig='',acc=0;
const PU=[{k:'blast',name:'Blast'},{k:'shield',name:'Shield'},{k:'slow',name:'Slow time'}],COL={blast:'#FF4FA3',shield:'#8CF5B0',slow:'#D3DAE4'};
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b),rand=(a,b)=>a+Math.random()*(b-a);
const bounds=()=>{const minX=P.L*.5+16,maxX=Math.max(minX,W/2-P.L*.5);return{minX,maxX,minY:P.L*.3+8,maxY:H-P.L*.3-8}};
const speed=()=>W*.33*cfg.speed*boost;
const fmt=s=>{s=Math.max(0,Math.ceil(s));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function sizes(){P.L=clamp(Math.min(W*.15,H*.24),72,240)*.85*eff('plane');BW=clamp(W*.015,14,30)*.8*eff('bars')}
function resize(){const oW=W,oH=H,dpr=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);sizes();if(!oW){P.tx=W*.3;P.y=P.ty=H*.45;const B=bounds();P.x=B.minX+(B.maxX-B.minX)*.3;build(W*.62);return}const sx=W/oW,sy=H/oH;bars.forEach(b=>{b.x*=sx;b.y0*=sy;b.y1*=sy});orbs.forEach(o=>{o.x*=sx;o.y*=sy});nextX*=sx;P.x*=sx;P.y*=sy;P.tx*=sx;P.ty*=sy}
function spawn(x){const kind=Math.random()<.3?'pair':(prev==='top'?'bottom':'top');prev=kind;const open=()=>H*rand(.4,.6);
if(kind==='top')bars.push({x,y0:0,y1:H-open()});else if(kind==='bottom')bars.push({x,y0:open(),y1:H});
else{const g=H*Math.max(.26,.36-.015*(level-1)),m=rand(g/2+H*.1,H-g/2-H*.1);bars.push({x,y0:0,y1:m-g/2},{x,y0:m+g/2,y1:H})}}
function fill(){while(nextX<W+BW){spawn(nextX);const st=Math.max(200,W*rand(.3,.42))*2.5*eff('course');if(st>P.L*1.6&&Math.random()<.5){const B=bounds();orbs.push({x:nextX+st/2,y:rand(B.minY,B.maxY),k:PU[Math.floor(Math.random()*3)].k})}nextX+=st}}
function build(x){bars=[];orbs=[];nextX=x;fill()}
function respace(r){const a=P.x+P.L;[...bars,...orbs].forEach(b=>{if(b.x>a)b.x=a+(b.x-a)*r});nextX=a+(nextX-a)*r;fill()}
function fire(){if(state!=='play'||!owned.length)return;const k=owned[sel];if(k==='blast'&&stock.blast){const p=pull(),d=Math.hypot(p.x,p.y),ux=d>4?p.x/d:1,uy=d>4?p.y/d:0;shots.push({x:P.x+ux*P.L*.3,y:P.y+uy*P.L*.3,ux,uy});if(!--stock.blast)deplete('blast')}else if(k==='slow'&&slowT<=0)slowT=10;else if(k==='shield'&&shieldT<=0)shieldT=5}
const can=k=>!owned.includes(k),nm=k=>PU.find(p=>p.k===k).name;
const badge=k=>k==='blast'?(stock.blast||''):k==='shield'&&shieldT>0?Math.ceil(shieldT):'';
function add(k){if(k==='blast')stock.blast=3;const n=owned.length;if(!n){owned=[k];sel=0}else if(n===1){owned.splice(sel,0,k);sel++}else owned.splice(sel+1,0,k)}
function deplete(k){const j=owned.indexOf(k);if(j<0)return;const was=j===sel;owned.splice(j,1);if(!owned.length){sel=0;return}if(!was){if(j<sel)sel--;return}sel=j?j-1:owned.length-1;sig='';paintReel();const r=ui.reel;r.classList.remove('spin');r.style.transform='translateY(-56px)';r.offsetHeight;r.classList.add('spin');r.style.transform='';spinning=true;setTimeout(()=>{r.classList.remove('spin');spinning=false},260)}
function paintReel(){const n=owned.length,s=sel+'|'+owned.map(k=>k+badge(k)).join()+'|'+(slowT>0);if(s!==sig){sig=s;ui.wheel.hidden=!n;ui.reel.innerHTML=[-2,-1,0,1,2].map(o=>{if(!n||(n===1&&o)||(n===2&&o>0))return'<li class="h-14"></li>';const k=owned[((sel+o)%n+n)%n];return`<li class="flex h-14 items-center gap-3 px-3"><span class="orb orb-${k} h-8 w-8 shrink-0 rounded-full${k==='slow'&&slowT>0?' pie':''}"></span><span class="font-display text-xs uppercase tracking-wider text-white">${nm(k)}</span><span class="ml-auto font-display text-base tabular-nums text-${k}">${badge(k)}</span></li>`}).join('')}if(slowT>0)ui.reel.querySelectorAll('.pie').forEach(el=>el.style.setProperty('--p',slowT/10))}
function step(dir){if(spinning||owned.length<2)return;if(owned.length===2)dir=-1;spinning=true;ui.reel.classList.add('spin');ui.reel.style.transform=`translateY(${-dir*56}px)`;setTimeout(()=>{const n=owned.length;sel=n?(sel+dir+n)%n:0;ui.reel.classList.remove('spin');ui.reel.style.transform='';sig='';paintReel();spinning=false},260)}
function setLives(){ui.lives.forEach((li,i)=>{li.classList.toggle('text-gold',i<lives);li.classList.toggle('text-charcoal',i>=lives)})}
function setLevel(){ui.level.textContent=`LEVEL ${level}`}
function start(){if(state==='over')build(W*.85);state='play';level=1;lives=3;left=LEVEL_TIME;flown=0;inv=0;boost=1;stock={blast:0};owned=[];sel=0;slowT=0;shieldT=0;shots=[];fx=[];setLives();setLevel();ui.panel.hidden=true;stage.classList.add('cursor-none')}
function over(){state='over';stage.classList.remove('cursor-none');ui.title.textContent=`Grounded on level ${level}`;ui.text.textContent=`You flew for ${fmt(flown)}. Three hits and the flight is over.`;ui.btn.textContent='Fly again';ui.panel.hidden=false;ui.btn.focus()}
function pause(){state='paused';stage.classList.remove('cursor-none');ui.title.textContent='Paused';ui.text.textContent='Press Esc or Resume to keep flying.';ui.btn.textContent='Resume';ui.panel.hidden=false}
function resume(){state='play';ui.panel.hidden=true;stage.classList.add('cursor-none')}
function aim(e){const r=cv.getBoundingClientRect();P.tx=e.clientX-r.left;P.ty=e.clientY-r.top}
ui.sliders.innerHTML=SPEC.map(([k,l])=>`<label for="t-${k}" class="grid gap-2 text-sm"><span class="flex justify-between"><span>${l}</span><output id="o-${k}" class="tabular-nums text-sky"></output></span><input id="t-${k}" type="range" min="0" max="2" step="0.05" class="w-full accent-gold"></label>`).join('');
function syncTune(){SPEC.forEach(([k])=>{document.getElementById('t-'+k).value=cfg[k];document.getElementById('o-'+k).textContent=Math.round(cfg[k]*100)+'%'});ui.god.checked=cfg.god}
function saveTune(){sizes();syncTune();try{localStorage.setItem('pp-tune2',JSON.stringify(cfg))}catch(e){}}
function toggleTune(){ui.tune.hidden=!ui.tune.hidden;ui.tuneBtn.setAttribute('aria-expanded',String(!ui.tune.hidden))}
ui.tune.addEventListener('input',e=>{const k=e.target.id.slice(2);if(k==='god')cfg.god=e.target.checked;else{const o=eff('course');cfg[k]=+e.target.value;if(k==='course')respace(eff('course')/o)}saveTune()});
ui.tune.addEventListener('submit',e=>e.preventDefault());
ui.reset.addEventListener('click',()=>{const o=eff('course');cfg={...DEF};respace(eff('course')/o);saveTune()});
ui.tuneBtn.addEventListener('click',toggleTune);
ui.fs.hidden=!document.fullscreenEnabled;
function toggleFs(){if(ui.fs.hidden)return;(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{ui.fs.hidden=true})}
ui.fs.addEventListener('click',toggleFs);
document.addEventListener('fullscreenchange',()=>{ui.fs.setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Fullscreen');if(!document.fullscreenElement&&state==='play')pause()});
[ui.tune,ui.tuneBtn,ui.fs].forEach(el=>el.addEventListener('pointermove',e=>e.stopPropagation()));
stage.addEventListener('pointermove',aim);stage.addEventListener('pointerdown',e=>{if(!e.target.closest('#tune,#tuneBtn,#fsBtn'))aim(e)});
stage.addEventListener('pointerdown',e=>{if(e.button===0&&!e.target.closest('#tune,#fsBtn'))fire()});
addEventListener('wheel',e=>{if(e.target.closest('#tune'))return;if(spinning){acc=0;return}acc+=e.deltaY;if(Math.abs(acc)>=40){step(acc>0?-1:1);acc=0}},{passive:true});
ui.btn.addEventListener('click',()=>state==='paused'?resume():start());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')toggleTune();else if(e.key==='f'||e.key==='F')toggleFs();else if(e.key==='Escape'){if(state==='play')pause();else if(state==='paused')resume()}else if(e.key==='Enter'&&state!=='play'&&!e.target.closest('button,#tune'))state==='paused'?resume():start()});
addEventListener('resize',resize);
const SHAPE=[[.5,0],[-.36,-.2],[-.5,.17],[-.27,.27],[0,0],[.15,.02]];
function hit(){const c=Math.cos(P.a),s=Math.sin(P.a);return SHAPE.some(([lx,ly])=>{lx*=.85*P.L;ly*=.85*P.L;const px=P.x+lx*c-ly*s,py=P.y+lx*s+ly*c;return bars.some(b=>px>=b.x&&px<=b.x+BW&&py>=b.y0&&py<=b.y1)})}
function powerups(dt){const c=Math.cos(P.a),s=Math.sin(P.a),r=P.L*.18,i=orbs.findIndex(o=>can(o.k)&&SHAPE.some(([lx,ly])=>Math.hypot(P.x+(lx*c-ly*s)*.85*P.L-o.x,P.y+(lx*s+ly*c)*.85*P.L-o.y)<r));if(i>=0){add(orbs[i].k);orbs.splice(i,1)}
if(slowT>0&&(slowT-=dt)<=0){slowT=0;deplete('slow')}if(shieldT>0&&(shieldT-=dt)<=0){shieldT=0;deplete('shield')}
const hh=P.L*.06,dist=W*1.4*dt,n=Math.max(1,Math.ceil(dist/(BW*.5)));shots.forEach(s=>{for(let j=0;j<n;j++){s.x+=s.ux*dist/n;s.y+=s.uy*dist/n;bars=bars.filter(b=>{const ok=s.x>=b.x-hh&&s.x<=b.x+BW+hh&&s.y>=b.y0-hh&&s.y<=b.y1+hh;if(ok)fx.push({x:b.x+BW/2,y:clamp(s.y,b.y0,b.y1),t:0});return!ok})}});shots=shots.filter(s=>s.x>-P.L&&s.x<W+P.L&&s.y>-P.L&&s.y<H+P.L);fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<.4)}
const GAIN=3;function pull(){const R=H*.3,dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy),k=d>R?R/d:1;return{x:dx*k,y:dy*k,R}}
function update(dt){if(state==='paused')return;const B=bounds(),wx=1/(.9*eff('inertia',.1)),wy=1/(.6*eff('inertia',.1));
const pu=pull(),tx=clamp(P.x+pu.x*GAIN,B.minX,B.maxX),ty=clamp(P.y+pu.y*GAIN,B.minY,B.maxY);
P.vx+=(wx*wx*(tx-P.x)-2*wx*P.vx)*dt;P.vy+=(wy*wy*(ty-P.y)-2*wy*P.vy)*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;
if(P.x>B.maxX||P.x<B.minX){P.x=clamp(P.x,B.minX,B.maxX);P.vx=0}if(P.y>B.maxY||P.y<B.minY){P.y=clamp(P.y,B.minY,B.maxY);P.vy=0}
const pos=1-2*(P.y-B.minY)/(B.maxY-B.minY),lean=clamp(-P.vy/(H*.6),-1,1);
P.lift+=((pos+lean)/2-P.lift)*(1-Math.exp(-dt/.15));P.a=-P.lift*.09;
if(state!=='play')return;
const d=speed()*dt*(slowT>0?.5:1);bars.forEach(b=>b.x-=d);orbs.forEach(o=>o.x-=d);orbs=orbs.filter(o=>o.x>-P.L);nextX-=d;bars=bars.filter(b=>b.x+BW>0);fill();
flown+=dt;left-=dt;boost=Math.min(boost*Math.pow(1.008,cfg.accel*dt),4);if(left<=0){level++;left=LEVEL_TIME;setLevel()}
powerups(dt);if(inv>0)inv-=dt;else if(shieldT<=0&&hit()){inv=cfg.god?.6:1.6;if(!cfg.god){lives--;setLives();if(!lives)over()}}}
function plane(){cx.save();cx.translate(P.x,P.y);cx.rotate(P.a);cx.scale(P.L,P.L);cx.globalAlpha=inv>0&&state==='play'&&Math.floor(inv*10)%2?.35:1;
const poly=(pts,f)=>{cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.closePath();cx.fillStyle=f;cx.fill()};
poly([[.5,0],[-.18,.1+.02*P.lift],[-.27,.27+.06*P.lift]],'#BFDDEE');
poly([[.5,0],[-.2,-.02],[-.5,.17],[-.18,.1+.02*P.lift]],'#FFFFFF');
